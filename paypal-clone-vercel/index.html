<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PayPal</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <section class="view on" id="v-home"><div class="scroll" id="home"></div></section>
  <section class="view" id="v-send"><div class="scroll" id="send" style="overflow:hidden;display:flex;flex-direction:column"></div></section>
  <section class="view" id="v-me"><div class="scroll" id="me"></div></section>
  <nav class="tabbar" id="tabbar"></nav>

  <div class="page side" id="balpage" style="z-index:38"></div>
  <div class="page" id="addpage" style="z-index:44"></div>
  <div class="page" id="detail"></div>
  <div class="page" id="flow"></div>
  <div class="page" id="tap" style="z-index:45"></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="sheet" id="sheet2" style="z-index:61;border-radius:22px 22px 0 0"></div>
  <div class="scrim" id="scrim2" style="z-index:60"></div>

  <div id="fid"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
